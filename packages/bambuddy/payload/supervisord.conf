[supervisord]
nodaemon=true
logfile=/var/packages/Bambuddy/var/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/packages/Bambuddy/var/supervisord.pid
childlogdir=/var/packages/Bambuddy/var/logs

[program:bambuddy]
directory=/var/packages/Bambuddy/target/app
command=/var/packages/Bambuddy/target/bin/python3.14 -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --loop asyncio --timeout-graceful-shutdown 5
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/packages/Bambuddy/var/logs/bambuddy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
